<!DOCTYPE html>
<html lang="eng">

<head>
    <title>
        {{ page.title }}
    </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicons/favicon-16x16.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <img src="img/header.png" alt="Garrett Liam States - Concerts International Voice & Acting Studio">
    </header>

    <nav class="top has-centered">
        <div class="top__links">
            <ul>
                <li>
                    <a href="/">
                        Welcome to the Theatre!
                    </a>
                </li>
                <li>
                    <a href="/services">
                        Services
                    </a>
                </li>
                <li>
                    <a href="/gallery">
                        Gallery
                    </a>
                </li>
                <li>
                    <a href="/testimonials">
                        Testimonials
                    </a>
                </li>
                <li>
                    <a href="/about">
                        About
                    </a>
                </li>
                <li>
                    <a href="/contact">
                        Contact
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    {{ content }}

    <footer class="top has-bg-light-grey">
        <div class="top__social">
            <ul>
                <li>
                    <a aria-label="Facebook" href="https://www.facebook.com/garrett1033">
                        <i class="fa-brands fa-facebook-square">Facebook</i>
                    </a>
                </li>
                <li>
                    <a aria-label="Google Reviews" href="https://www.google.com/search?q=garrett+liam+states">
                        <i class="fa-brands fa-google">Google Reviews</i>
                    </a>
                </li>
                <li>
                    <a href="/contact">
                        <i class="fa-solid fa-square-phone">Phone</i>
                    </a>
                </li>
                <li>
                    <a href="/contact">
                        <i class="fa-solid fa-square-envelope">Email</i>
                    </a>
                </li>
            </ul>
        </div>
    </footer>

</body>

</html>
